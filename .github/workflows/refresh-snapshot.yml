# Keeps the snapshot up to date with the wiki. Every 6 hours (or by hand) it
# asks the wiki for the Data: pages' revision IDs, one small request. Only
# when a page changed since the committed snapshot, and since the open
# refresh PR, does it scrape, download new images and run the data checks. An
# unchanged wiki is never scraped again, however long the gap (new Dragons the
# wiki hasn't added yet appear once it does).
#
# Only data changes here, so only the data tests run (`npm run test:data`):
# rules the snapshot must keep however many Dragons the wiki adds. The code
# checks (typecheck, lint, every test) run in ci.yml on PRs and pushes, so a
# code bug on main can't hold up a refresh. Broken wiki data mostly stops
# the Scrape step itself: buildSnapshot fails on records it can't read.
#
# Then it splits on one question, whether a Dragon was removed (a possible
# rename, which would orphan owned flags if published unanswered):
#   - none removed and the data checks pass: commit straight to main and start
#     the deploy. Nobody has to do anything.
#   - a Dragon removed, or the data checks failed: open or update one PR on the
#     `auto/snapshot-refresh` branch for a person. Rename candidates must be
#     answered by hand (`npm run snapshot -- --offline` on the branch) before
#     merging; merging deploys. The PR carries the new raw pages and images
#     but leaves snapshot.json as it was, so that run compares against the old
#     snapshot. The whole snapshot waits, since it is one file.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". `main` must accept pushes from the workflow (no
# branch protection). Schedules only run from the default branch. A commit
# pushed with the workflow token doesn't start other workflows, so the deploy
# is started by hand-off (`gh workflow run`), not by pages.yml's push trigger.
name: Refresh the snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

env:
  BRANCH: auto/snapshot-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The open refresh PR's pages.json, if there is one, so a wiki it
      # already caught up with isn't scraped again.
      - name: Read the open refresh PR's revisions
        id: baseline
        run: |
          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:public/data/raw/pages.json > "$RUNNER_TEMP/pr-pages.json"
            echo "args=--baseline $RUNNER_TEMP/pr-pages.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the wiki's revisions
        id: check
        run: npm run snapshot -- --check ${{ steps.baseline.outputs.args }}

      - name: Scrape
        id: scrape
        if: steps.check.outputs.changed == 'true'
        run: npm run snapshot -- --ci --report "$RUNNER_TEMP/report.md"

      - name: Run the data checks
        id: tests
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: npm run test:data

      - name: Note the checks in the report
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              echo "Data checks: passed."
            else
              echo "### ❌ Data checks failed"
              echo
              echo "The new data breaks a rule in scraper/snapshot.data.test.ts. See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          } >> "$RUNNER_TEMP/report.md"

      # Nothing removed and the data checks passed: publish without a person.
      - name: Publish to main and deploy
        id: publish
        if: steps.check.outputs.changed == 'true' && steps.tests.outcome == 'success' && steps.scrape.outputs.needs_review == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/images
          git commit -m "Refresh the snapshot from the wiki"
          git push origin HEAD:main
          # A review PR from an earlier run is out of date now.
          gh pr close "$BRANCH" --delete-branch --comment "Superseded: the latest refresh needed no review and went straight to main." || true
          gh workflow run pages.yml --ref main

      - name: Open or update the refresh PR
        if: steps.check.outputs.changed == 'true' && steps.publish.outcome != 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH }}
          commit-message: Refresh the snapshot from the wiki
          title: Refresh the snapshot from the wiki
          body-path: ${{ runner.temp }}/report.md
          add-paths: |
            public/data
            public/images
          delete-branch: true
