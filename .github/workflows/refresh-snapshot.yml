# Keeps the snapshot up to date with the wiki. Every 6 hours (or by hand) it
# asks the wiki for the Data: pages' revision IDs, one small request. Only
# when a page changed since the committed snapshot, and since the open
# refresh PR, does it scrape, download new images, re-cut the fixture, run
# the checks, and open or update one PR on the `auto/snapshot-refresh`
# branch. An unchanged wiki is never scraped again, however long the gap
# (new Dragons the wiki hasn't added yet appear once it does).
#
# Rename candidates are never answered here: the PR lists them, and they
# must be answered by hand (`npm run snapshot -- --offline` on the branch)
# before merging.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". Schedules only run from the default branch.
name: Refresh the snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

env:
  BRANCH: auto/snapshot-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The open refresh PR's pages.json, if there is one, so a wiki it
      # already caught up with isn't scraped again.
      - name: Read the open refresh PR's revisions
        id: baseline
        run: |
          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:public/data/raw/pages.json > "$RUNNER_TEMP/pr-pages.json"
            echo "args=--baseline $RUNNER_TEMP/pr-pages.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the wiki's revisions
        id: check
        run: npm run snapshot -- --check ${{ steps.baseline.outputs.args }}

      - name: Scrape
        if: steps.check.outputs.changed == 'true'
        run: npm run snapshot -- --ci --fixture --report "$RUNNER_TEMP/report.md"

      - name: Run the checks
        id: tests
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: npm run check && npm run lint && npm test

      - name: Note the checks in the report
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              echo "Checks (typecheck, lint, tests): passed."
            else
              echo "### ❌ Checks failed"
              echo
              echo "Typecheck, lint or tests failed on this data. See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          } >> "$RUNNER_TEMP/report.md"

      - name: Open or update the refresh PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH }}
          commit-message: Refresh the snapshot from the wiki
          title: Refresh the snapshot from the wiki
          body-path: ${{ runner.temp }}/report.md
          add-paths: |
            public/data
            public/images
            fixtures/real-records.json
          delete-branch: true
